name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff (py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      # The suite renders Qt offscreen: CI runners have no interactive desktop,
      # and the same variable is how the headless run is reproduced locally.
      QT_QPA_PLATFORM: offscreen
      # A service session installs the WinEvent hook but delivers no UI events at
      # all, so the live-desktop confirmation has nothing to confirm here.
      AUTOPILOT_NO_LIVE_DESKTOP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and dev deps
        run: pip install -e ".[win32,dev]"
      # `python -m pytest`, not bare `pytest`: the flat layout puts modules in the
      # repo root, and only `python -m` places the current directory on sys.path.
      - name: pytest
        run: python -m pytest tests -q --no-header
      - name: ruff
        run: python -m ruff check .

  mypy:
    # The project never claimed a clean mypy run, and a blocking job would freeze
    # every PR until the whole debt is paid. So the job always passes and publishes
    # the debt into the step summary instead: measurable on every run, invisible to
    # nobody, blocking to nobody. A red cross on an expected failure only trains
    # people to ignore red crosses.
    name: mypy (debt meter)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[win32,dev]"
      - name: mypy debt meter
        run: |
          python -m mypy . > mypy-report.txt 2>&1
          $code = $LASTEXITCODE
          $tail = Get-Content mypy-report.txt | Select-Object -Last 40
          Add-Content $env:GITHUB_STEP_SUMMARY "## mypy debt meter (exit $code)"
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          $tail | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          exit 0
